[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secretary"
version = "0.6.0"
description = "Batch local audio transcription to text (offline, faster-whisper)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "faster-whisper>=1.1.0",
    "tqdm>=4.66",
    "huggingface_hub[hf_xet]>=0.24",
    "pyannote.audio>=4.0",
]

[project.scripts]
secretary = "secretary.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
