name: Build secretary.exe

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        variant:
          - name: full
            artifact: secretary.exe
            collect: "--collect-all pyannote.audio"
            exclude: "--exclude-module tensorflow --exclude-module torchvision --exclude-module matplotlib"
          - name: light
            artifact: secretary-light.exe
            collect: ""
            exclude: "--exclude-module pyannote.audio --exclude-module torch --exclude-module speechbrain --exclude-module torchaudio --exclude-module torchvision --exclude-module lightning --exclude-module tensorflow --exclude-module matplotlib --exclude-module pandas --exclude-module scipy --exclude-module sklearn --exclude-module PIL --exclude-module cv2"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .
          pip install pyinstaller

      - name: Build exe (${{ matrix.variant.name }})
        run: |
          pyinstaller --onefile --name secretary-${{ matrix.variant.name }} --clean --noconfirm `
            --add-data ".env.example;." `
            --paths src `
            --collect-all faster_whisper `
            --collect-all ctranslate2 `
            --collect-all tqdm `
            --collect-all av `
            --collect-all huggingface_hub `
            --collect-all hf_xet `
            ${{ matrix.variant.collect }} `
            ${{ matrix.variant.exclude }} `
            secretary_entry.py
          Rename-Item "dist\secretary-${{ matrix.variant.name }}.exe" "${{ matrix.variant.artifact }}"

      - name: Upload ${{ matrix.variant.name }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant.artifact }}
          path: dist/${{ matrix.variant.artifact }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
